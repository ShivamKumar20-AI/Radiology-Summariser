# fly.toml app configuration file generated for radiology-summariser on 2026-08-10T15:28:43+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'radiology-summariser'
primary_region = 'lhr'

[build]
 dockerfile="Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop machines when there is no traffic and start one on the next request,
  # so the app costs nothing while idle. The first request after a quiet
  # period waits while a machine boots and loads the model.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
   path = "/health"
    timeout = "10s"


[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
