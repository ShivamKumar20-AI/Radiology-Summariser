# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
# Manual only. The live demo now runs on Streamlit (see streamlit_demo/), and this Fly deploy is kept
# for the API version. Run it by hand from the Actions tab if you want to deploy to Fly.
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
        with:
          # The model weights are stored in Git LFS. Without this, the
          # deploy would ship LFS pointer files and the API could not load the model.
          lfs: true
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
